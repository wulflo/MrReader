[package]
name = "mr-reader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["wulflo"]

[[bin]]
name = "mr-reader"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
rusqlite = { version = "0.42", features = ["bundled"] }
rayon = "1.12"
notify = "9.0.0-rc.8"
walkdir = "2.5"
pulldown-cmark = "0.13"
unicode-segmentation = "1.13"
unicode-normalization = "0.1.25"
async-channel = "2.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
num_cpus = "1.17"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
